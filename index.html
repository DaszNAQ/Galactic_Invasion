<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALACTIC INVASION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game-container">
        <canvas id="game" width="700" height="700" aria-label="Galactic Invasion - game canvas"></canvas>
        <p class="controls-hint">
            <span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> Di chuyển</span>
            <span><kbd>Space</kbd> Bắn</span>
            <span><kbd>P</kbd> Tạm dừng</span>
            <span><kbd>Enter</kbd> Bắt đầu / Chơi lại</span>
        </p>
    </main>
    <noscript>
        <p class="noscript">GALACTIC INVASION cần JavaScript để chạy. Vui lòng bật JavaScript trong trình duyệt.</p>
    </noscript>
    <script src="game.js"></script>
</body>
</html>
